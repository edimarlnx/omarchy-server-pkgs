# The serial console gets its own issue file.
#
# /etc/issue leads with the 81-column Omarchy logo, which is right for a video
# console (the installed system comes up well past 128 columns) and wrong for a
# serial line, where 80 columns is the contract and every logo row would wrap
# by one character. /etc/issue.serial carries the same information without the
# ASCII art.
#
# The ExecStart= reset is required: systemd appends to ExecStart in a drop-in
# unless the list is cleared first. Everything else is verbatim from
# serial-getty@.service so a systemd upgrade changes nothing but this flag.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --issue-file /etc/issue.serial --keep-baud 115200,57600,38400,9600 - $TERM

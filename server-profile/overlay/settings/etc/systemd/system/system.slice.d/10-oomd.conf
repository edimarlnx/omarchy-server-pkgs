# Server replacement for the desktop's /usr/lib/systemd/user/app.slice.d/10-oomd.conf.
#
# Upstream marks the *user* app.slice as the only kill candidate, so oomd takes
# the browser and the compositor survives. A server has no user session: with
# that drop-in and nothing else, systemd-oomd would be enabled and structurally
# unable to kill anything.
#
# system.slice covers the units that actually consume memory here — docker,
# containerd and everything they start lands under system.slice. Pressure and
# swap thresholds still come from /etc/systemd/oomd.conf.d/10-omarchy.conf.
#
# Deliberately not set on -.slice: that would make init and sshd eligible and
# turn a memory spike into a machine with no way back in.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill

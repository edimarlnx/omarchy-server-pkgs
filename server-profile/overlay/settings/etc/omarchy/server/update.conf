# How this machine takes its updates. Read by omarchy-server-update and by the
# three timers it manages. Shipped by omarchy-server-settings and listed in the
# package's backup= array, so an edit here survives every upgrade.
#
# Sourced as shell: KEY=value, no spaces around the `=`, no command substitution.
#
# The two toggles that are NOT here are KEXEC and TRANSACTIONAL. They live in
# /etc/omarchy-server-update.conf because the command writes them itself
# (`omarchy-server-update kexec on`, `omarchy-server-update transactional on`)
# and a file a program rewrites is a bad place for settings a person edits.

# Run the security-only update daily (omarchy-server-update-security.timer).
# A security-only run upgrades ONLY the installed packages that arch-audit
# reports as vulnerable with a fix already in the repositories, so the machine
# closes CVEs every day without taking the whole rolling release every day.
SECURITY_DAILY=yes

# The day of the week the FULL update runs (omarchy-server-update.timer), as a
# systemd OnCalendar day: sun mon tue wed thu fri sat. The full run happens at
# 03:00 on that day, an hour before the default reboot window below, so a
# reboot it makes necessary is taken by the reboot timer that follows it.
FULL_WEEKLY=sun

# When this machine is allowed to reboot itself, HH:MM-HH:MM in local time. A
# window that ends before it starts wraps around midnight (23:00-01:00 is two
# hours). A run that finds a reboot required outside the window leaves the
# reboot-required marker and says so; omarchy-server-update-reboot.timer fires
# at the start of the window and takes the reboot then.
REBOOT_WINDOW=04:00-05:00

# Compressed swap in RAM. zstd averages around 3:1, so even a full device
# occupies roughly a third of RAM.
#
# The desktop asks for `zram-size = ram`. A server is sized for its workload
# and should not be able to reserve 100% of RAM as swap backing, so the server
# profile halves it. There is no disk swapfile to spill to:
# the profile skips configure_hibernation and creates none (F.5).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd

swap-priority = 100

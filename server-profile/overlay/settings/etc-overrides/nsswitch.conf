# Name Service Switch configuration file.
# See nsswitch.conf(5) for details.
#
# Arch stock, with the systemd modules Omarchy keeps. The desktop version
# inserts `mdns_minimal [NOTFOUND=return]` into the hosts line for Avahi;
# avahi and nss-mdns are dropped in the server profile, and leaving the module
# in place makes every lookup fail through a missing NSS shared object
#.

passwd: files systemd
group: files [SUCCESS=merge] systemd
shadow: files systemd
gshadow: files systemd

publickey: files

hosts: mymachines resolve files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files
